[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-studio"
version = "0.2.1-beta"
description = "MCP Studio - Management tool for MCP servers (beta): Web dashboard (FastAPI) + MCP server (FastMCP 3.1.0+)"
authors = [{ name = "Sandra Schipal", email = "sandraschipal@hotmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastmcp[all]>=3.4.4,<4",
    "mcp>=1.0.0,<2.0.0",  # CRITICAL: Prevent MCP 1.16.0+ Python 3.13 incompatibility
    "anyio>=4.0.0,<5.0.0",  # CRITICAL: Prevent incompatible anyio versions
    "structlog>=23.0.0",
    "aiofiles>=23.0.0",
    "watchdog>=3.0.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.0.0",
    "aiohttp>=3.9.0",
    "httpx>=0.24.0",
    "prometheus-client>=0.19.0",
    "watchfiles>=0.21.0",  # For crashproofing and file monitoring
    "psutil>=5.9.0",  # For health.py system resource checks (was imported but never declared)
    "python-jose[cryptography]>=3.3.0",  # For auth.py JWT handling (was imported but never declared)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.16.0,<0.17",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
]

# uv dependency group - justfile `bootstrap` runs `uv sync --group dev`; the
# optional-dependencies above are kept for backward compatibility. Without this
# group, ruff/pytest never land in the venv and `just lint` silently fails.
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.16.0,<0.17",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mcp_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
addopts = "-v --cov=mcp_studio --cov-report=term-missing"
# Separate test markers for MCP server vs web app tests
markers = [
    "mcp_server: Tests for MCP server component (tools, FastMCP)",
    "web_app: Tests for web app component (FastAPI, routes, services)",
    "integration: Integration tests",
    "unit: Unit tests",
]

[tool.pyright]
include = ["src", "studio_dashboard.py"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*"]
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.10"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S104", "S310", "S311", "S314", "S608", "S108", "S603", "S301", "S103", "S112", "S105", "S607", "S701", "S102", "S307", "S324", "ASYNC230", "B008", "B904", "B025", "B019", "B023", "C901", "UP035", "RUF006", "N806", "E501", "F841", "PLW1510", "BLE001", "RUF022", "E402", "F811", "B006", "B007", "RUF059", "RUF001", "RUF002", "S110", "RUF012", "DTZ005", "DTZ006", "DTZ001", "E741", "SIM115", "SIM102", "RUF100", "F401", "D103", "D101", "F821", "TRY002", "S101", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
